[package]
name    = "word_count"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "word_count"
path = "src/main.rs"

[profile.release]
opt-level = "z"     # size-optimize; the interpreter doesn't care, but smaller .wasm is friendlier to commit
lto       = true
strip     = true
panic     = "abort" # WASI doesn't unwind anyway
